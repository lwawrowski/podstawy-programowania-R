<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 380" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- schemat kwiatu irysa: płatek (petal) i działka kielicha (sepal) -->
  <rect width="470" height="380" fill="#FFFFFF"/>
  <!-- łodyga -->
  <path d="M210 230 C 212 290, 205 330, 210 375" stroke="#66C981" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- działki kielicha: duże, opadające -->
  <g fill="#1E252D" opacity="0.92">
    <path d="M210 205 C 150 210, 70 250, 60 320 C 110 320, 180 270, 210 215 Z"/>
    <path d="M210 205 C 270 210, 350 250, 360 320 C 310 320, 240 270, 210 215 Z"/>
  </g>
  <!-- płatki: węższe, wzniesione -->
  <g fill="#A699FC">
    <path d="M210 210 C 180 160, 175 90, 210 40 C 245 90, 240 160, 210 210 Z"/>
    <path d="M206 208 C 165 190, 120 150, 118 105 C 160 115, 195 160, 206 208 Z" opacity="0.85"/>
    <path d="M214 208 C 255 190, 300 150, 302 105 C 260 115, 225 160, 214 208 Z" opacity="0.85"/>
  </g>
  <circle cx="210" cy="208" r="9" fill="#FB7153"/>
  <!-- miary płatka -->
  <g stroke="#FB7153" stroke-width="2.5" fill="none">
    <line x1="245" y1="45" x2="245" y2="200"/>
    <line x1="238" y1="45" x2="252" y2="45"/><line x1="238" y1="200" x2="252" y2="200"/>
    <line x1="186" y1="120" x2="234" y2="120"/>
  </g>
  <text x="255" y="70" font-size="15" fill="#1E252D" font-weight="700">Petal.Length</text>
  <text x="255" y="88" font-size="13" fill="#5E6670">długość płatka</text>
  <text x="20" y="40" font-size="15" fill="#1E252D" font-weight="700">Petal.Width</text>
  <text x="20" y="58" font-size="13" fill="#5E6670">szerokość płatka</text>
  <line x1="120" y1="52" x2="184" y2="118" stroke="#B7BFCB" stroke-width="1.5"/>
  <!-- miary działki -->
  <g stroke="#FB7153" stroke-width="2.5" fill="none">
    <line x1="215" y1="232" x2="352" y2="322"/>
    <line x1="290" y1="248" x2="262" y2="292"/>
  </g>
  <text x="300" y="350" font-size="15" fill="#1E252D" font-weight="700">Sepal.Length</text>
  <text x="300" y="368" font-size="13" fill="#5E6670">długość działki kielicha</text>
  <text x="10" y="350" font-size="15" fill="#1E252D" font-weight="700">Sepal.Width</text>
  <text x="10" y="368" font-size="13" fill="#5E6670">szerokość działki kielicha</text>
  <line x1="110" y1="338" x2="268" y2="282" stroke="#B7BFCB" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
